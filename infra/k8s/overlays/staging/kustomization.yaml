apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auralive-staging

bases:
  - ../../base

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auralive-web
    spec:
      replicas: 2
      template:
        spec:
          containers:
            - name: web
              resources:
                requests:
                  cpu: "500m"
                  memory: "1024Mi"
                limits:
                  cpu: "2000m"
                  memory: "4096Mi"

configMapGenerator:
  - name: auralive-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://staging.auralive.internal
      - PAYMENT_GATEWAY_PROVIDER=ccbill
      - KYC_PROVIDER=persona
      - LIVESTREAM_PROVIDER=livekit
      - COMPLIANCE_2257_STORAGE_BUCKET=vault-2257-compliance-staging
      - MEDIA_CDN_BASE_URL=https://cdn-staging.auralive.internal
      - PROTECTED_MEDIA_STORAGE_BUCKET=protected-ppv-media-staging
      - ENABLE_DEBUG_ENDPOINTS=false
      - ALLOW_DATA_MUTATION_SCRIPTS=true
