apiVersion: apps/v1
kind: Deployment
metadata:
  name: auralive-web
  labels:
    app.kubernetes.io/name: auralive-web
    app.kubernetes.io/part-of: auralive-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auralive-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auralive-web
    spec:
      containers:
        - name: web
          image: ghcr.io/kwstx/adult/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: auralive-config
            - secretRef:
                name: auralive-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
