# ============================================================================
# DEVELOPMENT INFRASTRUCTURE COMPOSE (docker-compose.dev.yml)
# Complete isolated local developer stack: PostgreSQL, Redis, MinIO S3, App, Worker
# ============================================================================

version: "3.8"

services:
  # 1. Authoritative Datastore (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: auralive-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: adult_platform_dev
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adult_platform_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Event Bus
  redis:
    image: redis:7-alpine
    container_name: auralive-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO S3 (Mock S3 Storage for 2257 Vault & PPV Media)
  minio:
    image: minio/minio:latest
    container_name: auralive-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev_minio_data:/data

  # 4. Next.js Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auralive-dev-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      APP_ENV: development
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/adult_platform_dev?schema=public"
      REDIS_URL: "redis://redis:6379"
      PAYMENT_GATEWAY_PROVIDER: "ccbill_mock"
      PAYMENT_WEBHOOK_SECRET: "whsec_dev_local_testing_secret_key_12345678"
      KYC_PROVIDER: "persona_mock"
      LIVESTREAM_PROVIDER: "livepeer_mux_mock"
      COMPLIANCE_2257_STORAGE_BUCKET: "vault-2257-compliance-dev"
      MEDIA_CDN_BASE_URL: "http://localhost:3000/media-mock"
      PROTECTED_MEDIA_STORAGE_BUCKET: "protected-ppv-media-dev"
      SESSION_SECRET: "dev_session_secret_local_only_abcdef12345678"
      ENABLE_DEBUG_ENDPOINTS: "true"
      ALLOW_DATA_MUTATION_SCRIPTS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Background Asynchronous Worker Runner
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auralive-dev-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: development
      APP_ENV: development
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/adult_platform_dev?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_minio_data:
