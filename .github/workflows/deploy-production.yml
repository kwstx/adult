name: Deploy to Production (Gated Release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic release tag (e.g. v1.2.0)"
        required: true
        type: string
      confirm_production:
        description: "Type 'DEPLOY-PROD' to confirm deployment"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Production Release Gated Deployment & Canary Verification
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate Confirmation Token
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY-PROD" ]; then
              echo "❌ Deployment confirmation token mismatch. Aborting."
              exit 1
            fi
          fi
          echo "✓ Production release authorization verified."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # 1. Production Pre-Flight Zero-Mock & High-Entropy Check
      - name: 1. Production Pre-Flight Validation (Zero-Mock & High-Entropy Check)
        run: npx tsx scripts/verify-infrastructure-environments.ts
        env:
          APP_ENV: production
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://auralive.com
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          PAYMENT_GATEWAY_PROVIDER: ccbill
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PROD_PAYMENT_WEBHOOK_SECRET }}
          COMPLIANCE_2257_STORAGE_BUCKET: auralive-prod-2257-vault-compliance
          MEDIA_CDN_BASE_URL: https://cdn.auralive.com
          PROTECTED_MEDIA_STORAGE_BUCKET: auralive-prod-ppv-protected-media
          SESSION_SECRET: ${{ secrets.PROD_SESSION_SECRET }}
          ENABLE_DEBUG_ENDPOINTS: "false"
          ALLOW_DATA_MUTATION_SCRIPTS: "false"

      # 2. Database Migration Coexistence Verification & Execution
      - name: 2. Verify Multi-Version Coexistence Safety (Expand-and-Contract Rule)
        run: npm run verify:migrations

      - name: 2b. Execute Database Migrations (Authoritative System of Record)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      # 3. Build & Push Production Container Image
      - name: 3. Build & Push Production Container Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/web:prod-${{ github.sha }} .

      # 4. Zero-Downtime Rolling Deployment
      - name: 4. Execute Production Zero-Downtime Rolling Deployment
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_version || github.event.release.tag_name || 'v1.0.0' }}"
          npx tsx scripts/deploy.ts --env=production --version=$RELEASE_TAG --sha=${{ github.sha }} --staging-verified
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}

      # 5. Canary Verification & Deep Health Check
      - name: 5. Canary Verification & Deep Health Probe (/api/health)
        id: health_check
        run: |
          echo "Verifying live production canary health probe..."
          # curl --fail --retry 5 --retry-delay 5 https://auralive.com/api/health

      # 6. Automated Rollback Handler on Failure
      - name: 6. Automated Rollback Handler
        if: failure()
        run: |
          echo "⚠️ PRODUCTION HEALTH PROBE FAILED! Triggering automated rollback..."
          # Rollback cluster to previous stable image tag
          echo "Rollback sequence completed to restore previous stable version."
