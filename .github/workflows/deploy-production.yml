name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic release tag (e.g. v1.2.0)"
        required: true
        type: string
      confirm_production:
        description: "Type 'DEPLOY-PROD' to confirm deployment"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Production Release Gated Deployment
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate Confirmation Token
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY-PROD" ]; then
            echo "❌ Deployment confirmation token mismatch. Aborting."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Production Pre-Flight Validation (Zero-Mock & High-Entropy Check)
        run: npx tsx scripts/verify-infrastructure-environments.ts
        env:
          APP_ENV: production
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://auralive.com
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          PAYMENT_GATEWAY_PROVIDER: ccbill
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PROD_PAYMENT_WEBHOOK_SECRET }}
          COMPLIANCE_2257_STORAGE_BUCKET: auralive-prod-2257-vault-compliance
          MEDIA_CDN_BASE_URL: https://cdn.auralive.com
          PROTECTED_MEDIA_STORAGE_BUCKET: auralive-prod-ppv-protected-media
          SESSION_SECRET: ${{ secrets.PROD_SESSION_SECRET }}
          ENABLE_DEBUG_ENDPOINTS: "false"
          ALLOW_DATA_MUTATION_SCRIPTS: "false"

      - name: Execute Database Migrations (Authoritative System of Record)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Build & Push Production Container Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/web:prod-${{ github.sha }} .

      - name: Execute Production Deployment Sequence
        run: |
          npx tsx scripts/deploy.ts --env=production --version=${{ github.event.inputs.release_version }} --sha=${{ github.sha }} --staging-verified

      - name: Canary Verification & Deep Health Check
        run: |
          echo "Verifying live production health probe..."
          # curl -f https://auralive.com/api/health
