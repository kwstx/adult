name: Deploy to Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Staging Deployment & Automated Smoke Tests
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Pre-Flight Environment Validation
        run: npx tsx scripts/verify-infrastructure-environments.ts
        env:
          APP_ENV: staging
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          PAYMENT_GATEWAY_PROVIDER: ccbill
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.STAGING_PAYMENT_WEBHOOK_SECRET }}
          COMPLIANCE_2257_STORAGE_BUCKET: vault-2257-compliance-staging
          MEDIA_CDN_BASE_URL: https://cdn-staging.auralive.internal
          PROTECTED_MEDIA_STORAGE_BUCKET: protected-ppv-media-staging
          SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}

      - name: Execute Database Migrations on Staging
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Build & Push Staging Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/web:staging-${{ github.sha }} .
          # docker push ghcr.io/${{ github.repository }}/web:staging-${{ github.sha }}

      - name: Deploy to Staging Cluster
        run: |
          npx tsx scripts/deploy.ts --env=staging --version=${{ github.ref_name }} --sha=${{ github.sha }}

      - name: Verify Staging Health Probe
        run: |
          echo "Verifying Staging endpoint health..."
          # curl -f https://staging.auralive.internal/api/health
