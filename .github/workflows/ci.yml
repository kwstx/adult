name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Schema Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Environment Schema & Configurations
        run: npx tsx scripts/verify-infrastructure-environments.ts

      - name: Verify Prisma Schema & Migrations Integrity
        run: npx tsx scripts/migrate.ts --env=development --status

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/adult_platform?schema=public"
          NEXT_PUBLIC_APP_NAME: "AuraLive CI"
