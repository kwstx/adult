name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-checks:
    name: Automated Checks (Typecheck, Lint, Tests, Security, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # 1. Type Checking
      - name: 1. TypeScript Type Checking (tsc --noEmit)
        run: npm run typecheck

      # 2. Linting
      - name: 2. Static Code Integrity & Linting
        run: npm run lint

      # 3. Unit Tests
      - name: 3. Business Functions Unit Tests
        run: npm run test:unit

      # 4. Integration Tests
      - name: 4. Database Transactions Integration Tests
        run: npm run test:integration

      # 5. Security Checks
      - name: 5. Security & Authorization Boundary Checks
        run: npm run test:security

      - name: 5b. Infrastructure Environment & Secret Policy Validation
        run: npx tsx scripts/verify-infrastructure-environments.ts

      # 6. Database Migration Coexistence & Backward Compatibility
      - name: 6. Multi-Version Migration Coexistence Check (Expand-Contract)
        run: npm run verify:migrations

      - name: 6b. Migration Coexistence & Zero-Downtime Test Suite
        run: npm run test:coexistence

      # 7. Pipeline Infrastructure Quality Gate
      - name: 7. Deployment Pipeline Engine Test Suite
        run: npm run test:infra

      # 8. Build
      - name: 8. Build Next.js Production Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/adult_platform?schema=public"
          NEXT_PUBLIC_APP_NAME: "AuraLive Platform"
